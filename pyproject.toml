[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "date-tool"
version = "0.1.0"
description = "A command-line tool for common date calculations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "holidays",
    "inflect",
    "python-dateutil",
    "questionary",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
date-tool = "date_tool.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
